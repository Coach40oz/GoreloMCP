# Sandbox drop-in for the main service. Install as
# /etc/systemd/system/gorelo-mcp.service.d/10-sandbox.conf. One setting per line, so that one that does not work
# in the container can be removed alone.
[Service]
# No access to physical devices: /dev holds only null, zero, random, urandom, tty and the like.
PrivateDevices=true
# Blocks reading the kernel log buffer (dmesg, /dev/kmsg).
ProtectKernelLogs=true
# Blocks changing the system clock and the hardware clock.
ProtectClock=true
# Blocks changing the hostname and domain name.
ProtectHostname=true
# Hides the /proc entries of other users' processes.
ProtectProc=invisible
# Leaves only the process directories in /proc, hiding /proc/sys-style files and other global entries.
ProcSubset=pid
# Allows only IPv4, IPv6 and Unix sockets: no netlink, packet or other socket families.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
# Blocks creating new namespaces (no containers inside the service).
RestrictNamespaces=true
# Blocks realtime scheduling policies.
RestrictRealtime=true
# Blocks system calls of other architectures (32-bit syscall tricks).
SystemCallArchitectures=native
# Allows only the system calls of ordinary services; mount, reboot, module loading, swap and the like are cut.
SystemCallFilter=@system-service
# A filtered system call returns EPERM instead of killing the process.
SystemCallErrorNumber=EPERM
# An empty value drops every capability from the bounding set (nothing can ever be regained).
CapabilityBoundingSet=
# An empty value grants no ambient capabilities to the process.
AmbientCapabilities=
# Removes the service's SysV and POSIX IPC objects when it stops.
RemoveIPC=true
# Blocks memory that is writable and executable at once (JIT shellcode); the likeliest setting to break a Python extension.
MemoryDenyWriteExecute=true
